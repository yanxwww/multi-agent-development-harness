id: security-reviewer
type: read-only
version: 1
default_pr_policy: none
mission: Review security risks and produce structured findings.
inputs:
  - pull request diff
  - security policy
outputs:
  - security findings
  - risk classification
allowed_changes: []
restricted_changes:
  - "**/*"
required_validation: []
allowed_skills:
  - security-review
escalation:
  - secret exposure suspected
  - authentication or authorization risk
