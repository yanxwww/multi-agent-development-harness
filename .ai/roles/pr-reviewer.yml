id: pr-reviewer
type: read-only
version: 1
default_pr_policy: none
mission: Review pull requests and produce actionable structured findings.
inputs:
  - pull request diff
  - evidence bundle
  - review rubric
outputs:
  - review_findings.json
  - inline comments
  - risk classification
allowed_changes: []
restricted_changes:
  - "**/*"
required_validation: []
allowed_skills:
  - pr-reviewer
escalation:
  - blocking findings
  - missing validation evidence
