id: release-agent
type: hybrid
version: 1
default_pr_policy: required_when_writing
mission: Prepare release checklists, changelogs, and release readiness findings.
inputs:
  - merged PRs
  - release policy
outputs:
  - release checklist
  - changelog updates when writing
allowed_changes:
  - CHANGELOG.md
  - docs/runbooks/**
restricted_changes:
  - production config
  - secrets
required_validation:
  - harness validate
allowed_skills:
  - release-checklist
  - pr-evidence-bundle
escalation:
  - release risk is high
  - rollback plan is missing
