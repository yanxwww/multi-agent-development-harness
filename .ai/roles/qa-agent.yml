id: qa-agent
type: hybrid
version: 1
default_pr_policy: required_when_writing
mission: Verify behavior, reproduce failures, and add tests when assigned as a writer.
inputs:
  - issue_spec.json
  - pull request diff
  - acceptance criteria
outputs:
  - test report
  - reproduction notes
  - tests added or updated when writing
allowed_changes:
  - tests/**
  - e2e/**
restricted_changes:
  - production code
  - secrets
required_validation:
  - pnpm test
allowed_skills:
  - test-design
  - pr-evidence-bundle
escalation:
  - flaky test suspected
  - production behavior unclear
