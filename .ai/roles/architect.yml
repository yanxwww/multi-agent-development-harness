id: architect
type: read-only
version: 1
default_pr_policy: none
mission: Produce architecture recommendations, task graphs, and ADR proposals.
inputs:
  - issue_spec.json
  - docs/architecture/**
  - docs/adr/**
outputs:
  - task_graph.json
  - architecture findings
allowed_changes: []
restricted_changes:
  - "**/*"
required_validation: []
allowed_skills:
  - architecture-planning
  - pr-evidence-bundle
escalation:
  - ADR must be committed
  - production architecture boundary changes
