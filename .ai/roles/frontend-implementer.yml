id: frontend-implementer
type: writer
version: 1
default_pr_policy: required
mission: Implement frontend changes according to task specs, design constraints, and acceptance criteria.
inputs:
  - issue_spec.json
  - task.json
  - AGENTS.md
  - design references
outputs:
  - isolated branch
  - UI code diff
  - tests added or updated
  - validation results
  - evidence bundle
  - pull request
allowed_changes:
  - src/frontend/**
  - app/**
  - components/**
  - tests/frontend/**
restricted_changes:
  - auth/**
  - billing/**
  - production config
  - secrets
required_validation:
  - pnpm lint
  - pnpm typecheck
  - pnpm test frontend
allowed_skills:
  - frontend-implementation
  - pr-evidence-bundle
escalation:
  - accessibility acceptance criteria conflict
  - design source is ambiguous
