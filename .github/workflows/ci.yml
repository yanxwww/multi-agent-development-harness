name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Harness validation and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Validate scaffold
        run: python -m ai_harness validate --target .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check whitespace
        run: git diff-tree --check --no-commit-id --root -r HEAD
