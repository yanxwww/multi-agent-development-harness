[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-development-harness"
version = "0.20.0"
description = "A neutral Codex / Claude Code AI automation development harness scaffold."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "AI Harness" }]

[project.scripts]
harness = "ai_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_harness*"]
